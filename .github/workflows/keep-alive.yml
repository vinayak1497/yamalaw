name: keep-alive

# Keeps the free-tier Render backend warm and the Supabase DB active.
# /api/health runs a `SELECT 1`, so every ping also counts as DB activity.
# Runs every 10 minutes + on demand. Never fails the workflow if the
# backend is temporarily unreachable (emits a warning instead).

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping YamaLaw backend health
        env:
          BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "::warning::RENDER_BACKEND_URL secret is not set — skipping keep-alive ping."
            exit 0
          fi
          curl -fsS --max-time 60 "$BACKEND_URL/api/health" | head -c 600
          echo
          echo "keep-alive ping OK"
